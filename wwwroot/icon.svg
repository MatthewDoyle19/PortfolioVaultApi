<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="vault-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f472b6" />
            <stop offset="100%" stop-color="#a855f7" />
        </linearGradient>

        <filter id="vault-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="20" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- قفل الخزنة المضيء بدون خلفية -->
    <g filter="url(#vault-glow)" fill="none" stroke="url(#vault-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
        <!-- قوس القفل -->
        <path d="M176 210 V140 A80 80 0 0 1 336 140 V210" />
        <!-- جسم الخزنة/القفل -->
        <rect x="128" y="210" width="256" height="210" rx="40" fill="#050505" opacity="0.8" />
        <!-- ثقب القفل/القلب -->
        <circle cx="256" cy="295" r="22" fill="url(#vault-grad)" stroke="none" />
        <path d="M256 310 L256 350" stroke-width="20" />
    </g>
</svg>
